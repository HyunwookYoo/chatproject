name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. A push to main never cancels the run that is already
# going, but only one more run of main may wait behind it: when several pushes arrive meanwhile, the
# newest waits and the ones before it are cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.44.6
  RUST_TOOLCHAIN: 1.92.0
  # cargokit (app/rust_builder) builds with this toolchain. Must equal RUST_TOOLCHAIN.
  CARGOKIT_TOOLCHAIN: 1.92.0
  CARGOKIT_VERBOSE: '1'

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ubuntu's system Python refuses pip installs (PEP 668), so use a venv.
      - name: Python with PyYAML
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml==6.0.3
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python tools/ci/check_workflows.py
      - run: python -m unittest discover -s tools/ci -p 'test_*.py' -v

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace
      # Keep feature-unified controller builds out of the ordinary/Release checks.
      - run: cargo test --locked -p chat_core --features test-hooks
      - run: cargo test --locked -p chat_ffi --features test-hooks
      - run: cargo test --locked -p chat_node --features harness
      - run: cargo clippy --workspace --all-targets -- -D warnings

  bindings:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      # Also caches ~/.cargo/bin, so the codegen below is built once.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: cargo install flutter_rust_bridge_codegen --version 2.11.1 --locked
      - run: cargo install cargo-expand --version 1.0.126 --locked
      - name: Regenerate
        run: |
          (cd app && flutter pub get)
          bash tools/gen_bindings.sh
      - name: Generated files match the commit
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "::error::Generated bindings differ from the commit. Run tools/gen_bindings.sh and commit the result."
            echo "$changes"
            git --no-pager diff
            exit 1
          fi

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: App analysis and widget tests
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Device tool tests
        working-directory: tools/e2e
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Python runtime fixtures with Dart present
        run: |
          dart --packages=tools/e2e/.dart_tool/package_config.json analyze tools/ci/release_smoke.dart
          python3 -m unittest discover -s tools/ci -p 'test_cargokit_toolchain.py' -v
          python3 -m unittest discover -s tools/ci -p 'test_release_smoke.py' -v

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Host node for desktop integration
        working-directory: .
        run: cargo build --locked -p chat_node --features harness
      - name: Every Windows integration file in a fresh Flutter process
        run: |
          # Flutter 3.44.6 closes DesktopDevice's log reader after the first file.
          foreach ($test in Get-ChildItem integration_test -Filter '*_test.dart' | Sort-Object Name) {
            flutter test $test.FullName -d windows
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Ordinary Release build and pinned native toolchain
        run: |
          if ($env:CARGOKIT_TOOLCHAIN -ne '1.92.0') { throw 'Missing pinned toolchain' }
          flutter build windows --release --target lib/main.dart -v *> "$env:RUNNER_TEMP/windows-release.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP/windows-release.log"; exit $LASTEXITCODE }
          if (!(Select-String -Path "$env:RUNNER_TEMP/windows-release.log" -SimpleMatch 'Running command rustup run 1.92.0 cargo build')) { throw 'Native toolchain proof missing' }
      - name: Ordinary Release marker and Home/native smoke
        working-directory: .
        run: |
          Push-Location tools/e2e
          dart pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Copy-Item -Recurse app/build/windows/x64/runner/Release "$env:RUNNER_TEMP/windows-ordinary"
          python tools/ci/check_release_hooks.py "$env:RUNNER_TEMP/windows-ordinary"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart --packages=tools/e2e/.dart_tool/package_config.json tools/ci/release_smoke.dart --platform windows --artifact "$env:RUNNER_TEMP/windows-ordinary"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dedicated actual Release contract
        run: |
          $nonce = [Guid]::NewGuid().ToString('N')
          flutter build windows --release --target integration_test/release_contract_test.dart "--dart-define=RELEASE_CONTRACT_NONCE=$nonce" *> "$env:RUNNER_TEMP/windows-contract.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP/windows-contract.log"; exit $LASTEXITCODE }
          Copy-Item -Recurse build/windows/x64/runner/Release "$env:RUNNER_TEMP/windows-contract"
          Push-Location ..
          python tools/ci/check_release_hooks.py "$env:RUNNER_TEMP/windows-contract"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart --packages=tools/e2e/.dart_tool/package_config.json tools/ci/release_smoke.dart --platform windows --artifact "$env:RUNNER_TEMP/windows-contract" --contract-nonce $nonce
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/chatproject-${{ github.run_id }}-${{ github.run_attempt }}-android
    steps:
      - name: Free disk space
        run: |
          # The emulator image and AVD need room. Never touch /usr/local/lib/android
          # (the SDK), Java, or anything the later steps install.
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/.ghcup \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/share/chromium
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Release APK
        working-directory: app
        env:
          CARGOKIT_VERBOSE: '1'
        run: |
          # The default step shell is `bash -e` without pipefail; tee would hide a failed build.
          set -o pipefail
          flutter pub get
          test "$CARGOKIT_TOOLCHAIN" = '1.92.0'
          flutter build apk --release --target lib/main.dart -v 2>&1 | tee "$RUNNER_TEMP/apk.log"
          # The vendored cargokit patch (CARGOKIT_TOOLCHAIN) must still be in effect.
          grep -q "Running command rustup run ${CARGOKIT_TOOLCHAIN} cargo build" "$RUNNER_TEMP/apk.log"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/ordinary-release.apk"
          nonce="$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          echo "RELEASE_CONTRACT_NONCE=$nonce" >> "$GITHUB_ENV"
          flutter build apk --release --target-platform android-x64 --target integration_test/release_contract_test.dart "--dart-define=RELEASE_CONTRACT_NONCE=$nonce"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/contract-release.apk"
          ./android/gradlew -p android --stop
      - name: Release native markers and tool packages
        run: |
          python3 tools/ci/check_release_hooks.py "$RUNNER_TEMP/ordinary-release.apk"
          python3 tools/ci/check_release_hooks.py "$RUNNER_TEMP/contract-release.apk"
          (cd tools/e2e && dart pub get --enforce-lockfile)
      - name: Canonical emulator configuration
        id: avd
        run: |
          python3 - <<'PY'
          import json, os
          config = json.load(open('tools/e2e/avd_config.json'))['ci']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in config.items():
                  print(f'{key}={value}', file=output)
          PY
      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ordinary-avd-${{ runner.os }}-${{ hashFiles('tools/e2e/avd_config.json') }}
      - name: Create AVD snapshot for the cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ steps.avd.outputs.api }}
          target: ${{ steps.avd.outputs.flavor }}
          arch: ${{ steps.avd.outputs.abi }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"
      - name: Integration tests on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ steps.avd.outputs.api }}
          target: ${{ steps.avd.outputs.flavor }}
          arch: ${{ steps.avd.outputs.abi }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            (cd app && flutter test integration_test -d emulator-5554)
            dart --packages=tools/e2e/.dart_tool/package_config.json tools/ci/release_smoke.dart --platform android --artifact "$RUNNER_TEMP/ordinary-release.apk" --serial emulator-5554
            dart --packages=tools/e2e/.dart_tool/package_config.json tools/ci/release_smoke.dart --platform android --artifact "$RUNNER_TEMP/contract-release.apk" --serial emulator-5554 --contract-nonce "$RELEASE_CONTRACT_NONCE"

  ios:
    runs-on: macos-26
    timeout-minutes: 50
    env:
      # One Rust slice (arm64) for the simulator instead of arm64 + x86_64.
      FLUTTER_XCODE_ARCHS: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios-sim
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # flutter test launches the app before its simulator log reader is attached, so it can miss
      # the line with the VM service URL and wait forever (flutter/flutter#181771). This patch is
      # the simulators.dart part of upstream PR flutter/flutter#193142: the tool launches the app
      # only after `log stream` has printed its first line. Drop it once Flutter ships the fix; a
      # Flutter upgrade then makes the apply fail loudly. Without the stamp the flutter script
      # rebuilds the tool.
      - name: Patch the Flutter tool (flutter/flutter#181771)
        run: |
          patch="$GITHUB_WORKSPACE/tools/ci/flutter-181771.patch"
          if git -C "$FLUTTER_ROOT" apply --reverse --check "$patch" 2>/dev/null; then echo "already patched"; else git -C "$FLUTTER_ROOT" apply "$patch"; fi
          rm -f "$FLUTTER_ROOT/bin/cache/flutter_tools.stamp"
          flutter --version
      - name: Flutter packages
        working-directory: app
        run: |
          flutter precache --ios
          flutter pub get
      - name: Rust library for the notification extension
        run: cargo build -p chat_nse --release --target aarch64-apple-ios-sim
      - name: Add the notification extension target
        run: |
          gem install xcodeproj -v 1.28.1 --no-document
          ruby app/ios/scripts/add_notification_service.rb app/ios/Runner.xcodeproj
          # A second run must change nothing.
          ruby app/ios/scripts/add_notification_service.rb app/ios/Runner.xcodeproj | grep -q "already up to date"
      - name: Pick and boot an iPhone simulator
        id: sim
        timeout-minutes: 10
        run: |
          xcrun simctl list devices available iOS --json > "$RUNNER_TEMP/sim.json"
          udid="$(python3 tools/ci/pick_simulator.py "$RUNNER_TEMP/sim.json")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$udid" -b
      # The patch above should fix the hang where flutter test misses the VM service line in the
      # simulator log and then waits forever after "Xcode build done" (flutter/flutter#181771). The
      # timeouts and the next two steps stay as a safety net, and those steps run with -v so a hang
      # after the fix still shows where the tool waits. The step timeout kills only the shell, so
      # they first kill the tool and the log stream of the earlier attempt. Drop the patch, the
      # retries and -v together once Flutter has the fix.
      - name: Integration tests on the simulator
        id: tests
        working-directory: app
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set -o pipefail
          test "$CARGOKIT_TOOLCHAIN" = '1.92.0'
          flutter test integration_test/core_test.dart -d "${{ steps.sim.outputs.udid }}" -v 2>&1 | tee "$RUNNER_TEMP/ios-debug.log"
          grep -q "Running command rustup run ${CARGOKIT_TOOLCHAIN} cargo build" "$RUNNER_TEMP/ios-debug.log"
      - name: Integration tests on the simulator, second attempt
        id: tests2
        if: steps.tests.outcome != 'success'
        working-directory: app
        timeout-minutes: 8
        continue-on-error: true
        run: |
          echo "::warning::The first test attempt failed or hung; trying again (flutter/flutter#181771)."
          ps -axo pid,ppid,etime,command | grep -E '[f]lutter_tools|[l]og stream|[R]unner.app' || true
          pkill -f flutter_tools.snapshot || true
          pkill -f "log stream" || true
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" dev.chatproject.chatapp || true
          flutter test -v integration_test/core_test.dart -d "${{ steps.sim.outputs.udid }}"
      - name: Integration tests on the simulator, third attempt
        if: steps.tests.outcome != 'success' && steps.tests2.outcome != 'success'
        working-directory: app
        timeout-minutes: 8
        run: |
          echo "::warning::The second test attempt also failed or hung; trying a last time (flutter/flutter#181771)."
          ps -axo pid,ppid,etime,command | grep -E '[f]lutter_tools|[l]og stream|[R]unner.app' || true
          pkill -f flutter_tools.snapshot || true
          pkill -f "log stream" || true
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" dev.chatproject.chatapp || true
          flutter test -v integration_test/core_test.dart -d "${{ steps.sim.outputs.udid }}"
      - name: Check the app and its extension (test build)
        run: bash tools/ci/check_ios_app.sh app/build/ios/iphonesimulator/Runner.app
      - name: Simulator diagnostics
        if: failure() || steps.tests.outcome == 'failure' || steps.tests2.outcome == 'failure'
        timeout-minutes: 5
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          # Best effort: nothing here may fail the step.
          set +e
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          echo "::group::Runner log inside the simulator (last 40 minutes)"
          t 90 xcrun simctl spawn "$UDID" log show --last 40m --style compact --predicate 'processImagePath ENDSWITH "/Runner"' | tail -300
          echo "::endgroup::"
          echo "::group::Crash reports"
          ls -lt ~/Library/Logs/DiagnosticReports | head -10
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/Runner* 2>/dev/null | head -2); do echo "== $f"; head -c 6000 "$f"; done
          echo "::endgroup::"
          exit 0

  # The simulator job above builds Debug for the simulator. Nothing else in CI compiles the Release
  # configuration for a device (what testflight.yml signs and uploads), and that workflow runs only for a
  # tag. This job builds it unsigned, so it needs no secrets, then looks inside the app.
  ios-release:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Rust library for the notification extension
        run: cargo build -p chat_nse --release --target aarch64-apple-ios
      - name: Add the notification extension target
        run: |
          gem install xcodeproj -v 1.28.1 --no-document
          ruby app/ios/scripts/add_notification_service.rb app/ios/Runner.xcodeproj
          # A second run must change nothing.
          ruby app/ios/scripts/add_notification_service.rb app/ios/Runner.xcodeproj | grep -q "already up to date"
      # --no-codesign makes Flutter pass CODE_SIGNING_ALLOWED=NO to xcodebuild, which wins over the
      # Manual signing and profile names that the script sets for Release.
      - name: Build the app for a device, unsigned
        working-directory: app
        run: |
          flutter pub get
          set -o pipefail
          test "$CARGOKIT_TOOLCHAIN" = '1.92.0'
          flutter build ios --release --no-codesign -v 2>&1 | tee "$RUNNER_TEMP/ios-release.log"
          grep -q "Running command rustup run ${CARGOKIT_TOOLCHAIN} cargo build" "$RUNNER_TEMP/ios-release.log"
      - name: Check the app and its extension (device build)
        env:
          CHECK_RELEASE_HOOKS: '1'
        run: bash tools/ci/check_ios_app.sh app/build/ios/iphoneos/Runner.app
