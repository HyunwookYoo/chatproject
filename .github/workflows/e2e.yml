name: Network E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '30 17 * * *'

permissions:
  contents: read

concurrency:
  group: network-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'
  RUST_TOOLCHAIN: '1.92.0'
  CARGOKIT_TOOLCHAIN: '1.92.0'
  CARGOKIT_VERBOSE: '1'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: SQL build prerequisites
        if: runner.os == 'Linux'
        run: |
          perl -v
          make --version
          cc --version
      - name: Set job-owned Gradle home
        # The runner validates this exact namespace before building. Its --stop
        # can only see this job's daemon registry, never a user's shared Gradle home.
        run: |
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/chatproject-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space for two emulator images
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install canonical emulator image
        run: |
          image="$(python3 -c 'import json; c=json.load(open("tools/e2e/avd_config.json"))["ci"]; print("system-images;android-{};{};{}".format(c["api"],c["flavor"],c["abi"]))')"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK root is required}}"
          test -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "$image" 'platform-tools' 'emulator'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/chat_e2e_1.avd
            ~/.android/avd/chat_e2e_1.ini
            ~/.android/avd/chat_e2e_2.avd
            ~/.android/avd/chat_e2e_2.ini
          # The clean snapshot depends on how emulators.dart prepares it (settle).
          key: nightly-avd-${{ runner.os }}-${{ hashFiles('tools/e2e/avd_config.json', 'tools/e2e/lib/src/emulators.dart') }}
      - name: Dart dependencies
        run: |
          (cd app && flutter pub get)
          (cd tools/e2e && dart pub get --enforce-lockfile)
      - name: Android two-app plus node scenario
        id: scenario
        working-directory: tools/e2e
        env:
          E2E_DIAGNOSTIC_FILE: ${{ runner.temp }}/e2e-diagnostic.json
        run: |
          test "$CARGOKIT_TOOLCHAIN" = '1.92.0'
          free -m
          # Sample only Gradle daemons inheriting this job's private registry.
          python3 -u - <<'PY' > "$RUNNER_TEMP/gradle-memory.txt" &
          import os, pathlib, time
          stop = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gradle-sampler-stop'
          expected = ('GRADLE_USER_HOME=' + os.environ['GRADLE_USER_HOME']).encode()
          peak = 0
          while not stop.exists():
              total = 0
              for process in pathlib.Path('/proc').glob('[0-9]*'):
                  try:
                      if expected not in (process / 'environ').read_bytes().split(b'\0'):
                          continue
                      if b'GradleDaemon' not in (process / 'cmdline').read_bytes():
                          continue
                      for line in (process / 'status').read_text().splitlines():
                          if line.startswith('VmRSS:'):
                              total += int(line.split()[1])
                  except (OSError, ValueError):
                      pass
              peak = max(peak, total)
              time.sleep(1)
          print('Owned Gradle daemon peak RSS KiB:', peak)
          PY
          sampler=$!
          trap 'touch "$RUNNER_TEMP/gradle-sampler-stop"; wait "$sampler"' EXIT
          set +e
          /usr/bin/time -v -o "$RUNNER_TEMP/e2e-time.txt" dart run bin/run.dart --profile android --repo-root "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/e2e-private.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          free -m
          touch "$RUNNER_TEMP/gradle-sampler-stop"
          wait "$sampler"
          cat "$RUNNER_TEMP/gradle-memory.txt"
          echo "Android scenario exit code: $code"
          exit "$code"
      - name: Sanitized retained summary
        if: always()
        env:
          SCENARIO_CODE: ${{ steps.scenario.outputs.exit_code }}
          JOB_STATUS: ${{ job.status }}
        run: |
          stage=preparation
          code=1
          if [ -n "$SCENARIO_CODE" ]; then stage=scenario; code="$SCENARIO_CODE"; fi
          outcome=failure
          if [ "$code" = 0 ]; then outcome=success; fi
          if [ "$JOB_STATUS" = cancelled ]; then outcome=cancelled; code=130; fi
          python3 tools/ci/write_e2e_summary.py --profile android --stage "$stage" --outcome "$outcome" --exit-code "$code" --memory-file "$RUNNER_TEMP/e2e-time.txt" --diagnostic-file "$RUNNER_TEMP/e2e-diagnostic.json" --output "$RUNNER_TEMP/e2e-summary.json"
          echo 'GNU time maximum child RSS is not the simultaneous total of two AVDs and Gradle.' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/e2e-summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain only the sanitized summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-e2e-summary
          path: ${{ runner.temp }}/e2e-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: M3 account/auth and M4 message regressions
        id: account_scenario
        # Also after the m2 run failed (it wrote an exit code): each scenario
        # boots its own emulators, and the job still fails on m2.
        if: ${{ !cancelled() && steps.scenario.outputs.exit_code != '' }}
        working-directory: tools/e2e
        run: |
          set +e
          code=0
          failed=
          # M6 (phone, mailbox, node) and M7 (app, two nodes, local push proxy)
          # need an Android phone: android job only. Each scenario boots its own
          # emulators, so every one runs even after a failure; the step fails
          # with the first failure's code.
          for scenario in m3 m3-auth m4 m6 m7; do
            E2E_DIAGNOSTIC_FILE="$RUNNER_TEMP/$scenario-diagnostic.json" dart run bin/run.dart --profile android --scenario "$scenario" --repo-root "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/$scenario-private.log" 2>&1
            result=$?
            echo "$result" > "$RUNNER_TEMP/$scenario-code.txt"
            echo "scenario $scenario: exit $result"
            if [ "$result" -ne 0 ] && [ -z "$failed" ]; then failed=$scenario; code=$result; echo "failed scenario: $scenario"; fi
          done
          echo "account_scenario=${failed:-m6}" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: M3 sanitized account summary
        if: always() && steps.account_scenario.outcome != 'skipped'
        env:
          ACCOUNT_CODE: ${{ steps.account_scenario.outputs.exit_code }}
          ACCOUNT_SCENARIO: ${{ steps.account_scenario.outputs.account_scenario }}
        run: |
          code="${ACCOUNT_CODE:-1}"
          outcome=failure; if [ "$code" = 0 ]; then outcome=success; fi
          case "$ACCOUNT_SCENARIO" in m3|m3-auth|m4|m6|m7) ;; *) ACCOUNT_SCENARIO=m3 ;; esac
          mkdir -p "$RUNNER_TEMP/account-summaries"
          python3 tools/ci/write_e2e_summary.py --profile android --stage scenario --outcome "$outcome" --exit-code "$code" --diagnostic-file "$RUNNER_TEMP/$ACCOUNT_SCENARIO-diagnostic.json" --output "$RUNNER_TEMP/account-summaries/m3-summary.json"
          cat "$RUNNER_TEMP/account-summaries/m3-summary.json" >> "$GITHUB_STEP_SUMMARY"
          # One summary per scenario that ran, with its own exit code.
          for scenario in m3 m3-auth m4 m6 m7; do
            [ -f "$RUNNER_TEMP/$scenario-code.txt" ] || continue
            each="$(cat "$RUNNER_TEMP/$scenario-code.txt")"
            case "$each" in ''|*[!0-9]*) each=1 ;; esac
            result=failure; if [ "$each" = 0 ]; then result=success; fi
            python3 tools/ci/write_e2e_summary.py --profile android --stage scenario --outcome "$result" --exit-code "$each" --diagnostic-file "$RUNNER_TEMP/$scenario-diagnostic.json" --output "$RUNNER_TEMP/account-summaries/$scenario-summary.json"
          done
      - name: Retain sanitized M3 summary only
        if: always() && steps.account_scenario.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-m3-account-summary
          path: ${{ runner.temp }}/account-summaries/*-summary.json
          if-no-files-found: error
          retention-days: 14

  android-fcm:
    # Real FCM (spec 11, Ruling R5): the debug app built with google-services.json on a Google
    # Play image, the local push proxy with the Firebase service account, a chat_node sender.
    # Without either secret the job only notes that it skipped. No artifact leaves the run
    # (rule c): the summary goes to the step summary only.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: push-e2e
    steps:
      - name: FCM secrets present
        id: secret
        env:
          FCM_SET: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON != '' }}
          SERVICES_SET: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: |
          present=false
          if [ "$FCM_SET" = true ] && [ "$SERVICES_SET" = true ]; then
            present=true
          else
            echo "skipped: no FCM secret" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
      - name: SQL build prerequisites
        if: steps.secret.outputs.present == 'true'
        run: |
          perl -v
          make --version
          cc --version
      - name: Set job-owned Gradle home
        if: steps.secret.outputs.present == 'true'
        run: |
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/chatproject-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secret.outputs.present == 'true'
        with:
          persist-credentials: false
      - name: Free disk space for the emulator image
        if: steps.secret.outputs.present == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
          df -h /
      - name: Enable KVM
        if: steps.secret.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.secret.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        if: steps.secret.outputs.present == 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.secret.outputs.present == 'true'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.secret.outputs.present == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install the Google Play emulator image
        # The `local` image of avd_config.json (google_apis_playstore): FCM needs Play services.
        if: steps.secret.outputs.present == 'true'
        run: |
          image="$(python3 -c 'import json; c=json.load(open("tools/e2e/avd_config.json"))["local"]; print("system-images;android-{};{};{}".format(c["api"],c["flavor"],c["abi"]))')"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK root is required}}"
          test -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "$image" 'platform-tools' 'emulator'
      - name: Write the Firebase service account
        if: steps.secret.outputs.present == 'true'
        env:
          FCM_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$FCM_JSON" > "$RUNNER_TEMP/fcm-service-account.json"
      - name: Write google-services.json
        if: steps.secret.outputs.present == 'true'
        env:
          SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          umask 077
          printf '%s' "$SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
      - name: Place google-services.json for this build only
        # R16: the app turns Firebase on only when this file exists; it is never committed.
        if: steps.secret.outputs.present == 'true'
        run: cp "$RUNNER_TEMP/google-services.json" app/android/app/google-services.json
      - name: Dart dependencies
        if: steps.secret.outputs.present == 'true'
        run: |
          (cd app && flutter pub get)
          (cd tools/e2e && dart pub get --enforce-lockfile)
      - name: Real FCM push into a killed app
        id: scenario
        if: steps.secret.outputs.present == 'true'
        working-directory: tools/e2e
        env:
          E2E_AVD_PROFILE: local
          E2E_FCM_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/fcm-service-account.json
          E2E_DIAGNOSTIC_FILE: ${{ runner.temp }}/m7-fcm-diagnostic.json
        run: |
          test "$CARGOKIT_TOOLCHAIN" = '1.92.0'
          set +e
          dart run bin/run.dart --profile android --scenario m7-fcm --repo-root "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/m7-fcm-private.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "m7-fcm scenario exit code: $code"
          exit "$code"
      - name: Sanitized summary
        if: always() && steps.secret.outputs.present == 'true'
        env:
          SCENARIO_CODE: ${{ steps.scenario.outputs.exit_code }}
        run: |
          code="${SCENARIO_CODE:-1}"
          stage=scenario; if [ -z "$SCENARIO_CODE" ]; then stage=preparation; fi
          outcome=failure; if [ "$code" = 0 ]; then outcome=success; fi
          python3 tools/ci/write_e2e_summary.py --profile android --stage "$stage" --outcome "$outcome" --exit-code "$code" --diagnostic-file "$RUNNER_TEMP/m7-fcm-diagnostic.json" --output "$RUNNER_TEMP/m7-fcm-summary.json"
          cat "$RUNNER_TEMP/m7-fcm-summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the Firebase files
        if: always()
        run: rm -f "$RUNNER_TEMP/fcm-service-account.json" "$RUNNER_TEMP/google-services.json" app/android/app/google-services.json

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Dart dependencies
        run: |
          Push-Location app
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location tools/e2e
          dart pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Windows two-app plus node scenario
        id: scenario
        working-directory: tools/e2e
        env:
          E2E_DIAGNOSTIC_FILE: ${{ runner.temp }}/e2e-diagnostic.json
        run: |
          if ($env:CARGOKIT_TOOLCHAIN -ne '1.92.0') { throw 'Missing pinned toolchain' }
          dart run bin/run.dart --profile windows --repo-root "$env:GITHUB_WORKSPACE" *> "$env:RUNNER_TEMP/e2e-private.log"
          $code = $LASTEXITCODE
          "exit_code=$code" >> $env:GITHUB_OUTPUT
          Write-Output "Windows scenario exit code: $code"
          exit $code
      - name: Sanitized retained summary
        if: always()
        env:
          SCENARIO_CODE: ${{ steps.scenario.outputs.exit_code }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $stage = 'preparation'; $code = 1; $outcome = 'failure'
          if ($env:SCENARIO_CODE) { $stage = 'scenario'; $code = [int]$env:SCENARIO_CODE }
          if ($code -eq 0) { $outcome = 'success' }
          if ($env:JOB_STATUS -eq 'cancelled') { $outcome = 'cancelled'; $code = 130 }
          python tools/ci/write_e2e_summary.py --profile windows --stage $stage --outcome $outcome --exit-code $code --diagnostic-file "$env:RUNNER_TEMP/e2e-diagnostic.json" --output "$env:RUNNER_TEMP/e2e-summary.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:RUNNER_TEMP/e2e-summary.json" >> $env:GITHUB_STEP_SUMMARY
      - name: Retain only the sanitized summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-e2e-summary
          path: ${{ runner.temp }}/e2e-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: M3 account/auth and M4 message regressions
        id: account_scenario
        if: steps.scenario.outcome == 'success'
        working-directory: tools/e2e
        run: |
          $code = 0
          foreach ($scenario in @('m3', 'm3-auth', 'm4')) {
            "account_scenario=$scenario" >> $env:GITHUB_OUTPUT
            $env:E2E_DIAGNOSTIC_FILE = "$env:RUNNER_TEMP/$scenario-diagnostic.json"
            dart run bin/run.dart --profile windows --scenario $scenario --repo-root "$env:GITHUB_WORKSPACE" *> "$env:RUNNER_TEMP/$scenario-private.log"
            $code = $LASTEXITCODE
            if ($code -ne 0) { Write-Output "failed scenario: $scenario"; break }
          }
          "exit_code=$code" >> $env:GITHUB_OUTPUT
          exit $code
      - name: M3 sanitized account summary
        if: always() && steps.account_scenario.outcome != 'skipped'
        env:
          ACCOUNT_CODE: ${{ steps.account_scenario.outputs.exit_code }}
          ACCOUNT_SCENARIO: ${{ steps.account_scenario.outputs.account_scenario }}
        run: |
          $code = 1; $outcome = 'failure'
          if ($env:ACCOUNT_CODE) { $code = [int]$env:ACCOUNT_CODE }
          if ($code -eq 0) { $outcome = 'success' }
          $scenario = 'm3'
          if (@('m3', 'm3-auth', 'm4') -contains $env:ACCOUNT_SCENARIO) { $scenario = $env:ACCOUNT_SCENARIO }
          python tools/ci/write_e2e_summary.py --profile windows --stage scenario --outcome $outcome --exit-code $code --diagnostic-file "$env:RUNNER_TEMP/$scenario-diagnostic.json" --output "$env:RUNNER_TEMP/m3-summary.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:RUNNER_TEMP/m3-summary.json" >> $env:GITHUB_STEP_SUMMARY
      - name: Retain sanitized M3 summary only
        if: always() && steps.account_scenario.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-m3-account-summary
          path: ${{ runner.temp }}/m3-summary.json
          if-no-files-found: error
          retention-days: 14
