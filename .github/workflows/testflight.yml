name: testflight

# Signed build -> App Store Connect. Start it with a `testflight-<n>` tag on a pushed commit,
# or from the Actions tab once the workflow is on main. The secrets live in the `testflight`
# Environment, which needs the owner's approval for every run.
on:
  workflow_dispatch:
  push:
    tags: ['testflight-*']

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

# No secret goes here or into a job-level env: cargokit's build_pod.sh runs `env`, so a failed
# "Build IPA" would print every variable it inherits. Secrets appear only in the steps that need them.
env:
  FLUTTER_VERSION: 3.44.6
  RUST_TOOLCHAIN: 1.92.0
  # cargokit (app/rust_builder) builds with this toolchain. Must equal RUST_TOOLCHAIN.
  CARGOKIT_TOOLCHAIN: 1.92.0
  XCODE: /Applications/Xcode_26.6.app
  APP_ID: dev.chatproject.chatapp
  NSE_ID: dev.chatproject.chatapp.NotificationService
  APP_GROUP: group.dev.chatproject.chatapp
  # Must equal PROVISIONING_PROFILE_SPECIFIER in app/ios/scripts/add_notification_service.rb.
  APP_PROFILE_NAME: ChatProject App Store
  NSE_PROFILE_NAME: ChatProject NSE App Store

jobs:
  testflight:
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 90
    steps:
      - name: Refuse re-runs
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "::error::A re-run reuses build number $GITHUB_RUN_NUMBER, which App Store Connect rejects. Start a new run instead."
            exit 1
          fi

      # Each expression below is evaluated before the step starts and yields true or false, so this
      # step learns whether a secret is set and never receives its value. It fails the run in
      # seconds, with the secret's name, instead of half an hour into the build.
      - name: Check that the signing and upload secrets are set
        env:
          CERT_FILE_SET: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 != '' }}
          CERT_PASSWORD_SET: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD != '' }}
          APP_PROFILE_SET: ${{ secrets.APPSTORE_PROFILE_APP_BASE64 != '' }}
          NSE_PROFILE_SET: ${{ secrets.APPSTORE_PROFILE_NSE_BASE64 != '' }}
          ISSUER_ID_SET: ${{ secrets.APPSTORE_ISSUER_ID != '' }}
          API_KEY_ID_SET: ${{ secrets.APPSTORE_API_KEY_ID != '' }}
          API_KEY_SET: ${{ secrets.APPSTORE_API_PRIVATE_KEY != '' }}
        run: |
          missing=""
          [ "$CERT_FILE_SET" = true ] || missing="$missing APPSTORE_CERTIFICATES_FILE_BASE64"
          [ "$CERT_PASSWORD_SET" = true ] || missing="$missing APPSTORE_CERTIFICATES_PASSWORD"
          [ "$APP_PROFILE_SET" = true ] || missing="$missing APPSTORE_PROFILE_APP_BASE64"
          [ "$NSE_PROFILE_SET" = true ] || missing="$missing APPSTORE_PROFILE_NSE_BASE64"
          [ "$ISSUER_ID_SET" = true ] || missing="$missing APPSTORE_ISSUER_ID"
          [ "$API_KEY_ID_SET" = true ] || missing="$missing APPSTORE_API_KEY_ID"
          [ "$API_KEY_SET" = true ] || missing="$missing APPSTORE_API_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::These secrets are empty or missing in the testflight Environment:$missing"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pin Xcode
        run: |
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Rust library for the notification extension
        run: cargo build -p chat_nse --release --target aarch64-apple-ios

      - name: Add the notification extension target
        run: |
          gem install xcodeproj -v 1.28.1 --no-document
          ruby app/ios/scripts/add_notification_service.rb app/ios/Runner.xcodeproj

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9 # v7.1.0
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Distribution identity check
        run: |
          # Print the count only: an identity line carries the certificate holder's name, and this log is
          # public. (import-codesign-certs already sets the keychain's 6 hour lock timeout.)
          count="$(security find-identity -v -p codesigning | grep -c 'Apple Distribution' || true)"
          echo "Apple Distribution identities in the keychain: $count"
          [ "$count" -gt 0 ] || { echo "::error::no usable Apple Distribution identity (is the private key inside the .p12?)"; exit 1; }

      - name: Install provisioning profiles
        env:
          APP_PROFILE_B64: ${{ secrets.APPSTORE_PROFILE_APP_BASE64 }}
          NSE_PROFILE_B64: ${{ secrets.APPSTORE_PROFILE_NSE_BASE64 }}
        run: |
          set -euo pipefail
          legacy="$HOME/Library/MobileDevice/Provisioning Profiles"
          xcode16="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$legacy" "$xcode16"
          pb=/usr/libexec/PlistBuddy
          # The team is set once, in the script that writes DEVELOPMENT_TEAM into the project.
          expected_team="$(awk -F"'" '/^TEAM = /{print $2}' app/ios/scripts/add_notification_service.rb || true)"
          [ -n "$expected_team" ] || { echo "::error::no TEAM = '...' line in app/ios/scripts/add_notification_service.rb"; exit 1; }

          install_profile() { # label base64 bundle-id expected-name env-prefix
            local f="$RUNNER_TEMP/$1.mobileprovision" p="$RUNNER_TEMP/$1.plist"
            local uuid name team appid groups
            printf '%s' "$2" | base64 --decode > "$f" \
              || { echo "::error::secret APPSTORE_PROFILE_$5_BASE64 is not valid base64"; exit 1; }
            [ -s "$f" ] || { echo "::error::secret APPSTORE_PROFILE_$5_BASE64 is empty"; exit 1; }
            security cms -D -i "$f" > "$p" \
              || { echo "::error::secret APPSTORE_PROFILE_$5_BASE64 is not a .mobileprovision file"; exit 1; }
            uuid=$($pb -c 'Print :UUID' "$p")
            name=$($pb -c 'Print :Name' "$p")
            team=$($pb -c 'Print :TeamIdentifier:0' "$p")
            appid=$($pb -c 'Print :Entitlements:application-identifier' "$p")
            groups=$($pb -c 'Print :Entitlements:com.apple.security.application-groups' "$p" 2>/dev/null || true)
            [ "$team" = "$expected_team" ] || { echo "::error::$1 profile belongs to team $team, but TEAM in app/ios/scripts/add_notification_service.rb is $expected_team"; exit 1; }
            [ "$appid" = "$team.$3" ] || { echo "::error::$1 profile is for $appid, expected $team.$3"; exit 1; }
            [ "$name" = "$4" ] || { echo "::error::$1 profile is named '$name', expected '$4'"; exit 1; }
            if $pb -c 'Print :ProvisionedDevices' "$p" >/dev/null 2>&1; then
              echo "::error::$1 is not an App Store profile"; exit 1
            fi
            case "$groups" in
              *"$APP_GROUP"*) ;;
              *) echo "::error::$1 profile lacks $APP_GROUP; enable App Groups on the App ID, then regenerate it"; exit 1 ;;
            esac
            cp "$f" "$legacy/$uuid.mobileprovision"
            cp "$f" "$xcode16/$uuid.mobileprovision"
            echo "$5_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
            echo "TEAM_ID=$team" >> "$GITHUB_ENV"
          }

          install_profile app "$APP_PROFILE_B64" "$APP_ID" "$APP_PROFILE_NAME" APP
          install_profile nse "$NSE_PROFILE_B64" "$NSE_ID" "$NSE_PROFILE_NAME" NSE
          [ "$($pb -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/app.plist")" = production ] \
            || { echo "::error::app profile has no production aps-environment"; exit 1; }

      - name: Write ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_ID}</key><string>${APP_PROFILE_UUID}</string>
              <key>${NSE_ID}</key><string>${NSE_PROFILE_UUID}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Build IPA
        working-directory: app
        run: |
          flutter pub get
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      # flutter build ipa exits 0 even when `xcodebuild -exportArchive` fails, so check the IPA.
      - name: Locate IPA and check its contents
        id: ipa
        run: |
          set -euo pipefail
          # find fails when a directory is missing; `|| true` lets the ::error:: below speak instead.
          ipa="$(find app/build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit 2>/dev/null || true)"
          test -n "$ipa" || { echo "::error::no IPA was exported"; exit 1; }
          unzip -q "$ipa" -d "$RUNNER_TEMP/ipa"
          app_dir="$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)"
          test -n "$app_dir" || { echo "::error::the IPA has no Payload/*.app"; exit 1; }
          # The checks that ci.yml runs on the unsigned build (job ios-release), plus the signed
          # entitlements. NSE_ID and APP_GROUP come from the workflow env.
          bash tools/ci/check_ios_app.sh --signed "$app_dir"
          echo "path=$ipa" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@14df18fee5a4ff3b76971dd382f033494a0194e9 # v5.5.0
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          app-type: ios
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
