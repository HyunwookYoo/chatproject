[package]
name = "chat_ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
chat_core = { path = "../../core/chat_core" }
flutter_rust_bridge = "=2.11.1"
