[package]
name = "chat_core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
