[package]
name = "chat_core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
bip39 = { version = "=2.2.2", default-features = false, features = ["std", "zeroize"] }
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
hkdf = "=0.12.4"
sha2 = "=0.10.9"
subtle = "=2.6.1"
getrandom = "=0.3.4"
zeroize = { version = "=1.9.0", features = ["zeroize_derive"] }
data-encoding = "=2.11.1"
aes-gcm = "=0.10.3"
snow = "=0.10.0"
minicbor = { version = "=0.26.5", features = ["std"] }
pkarr = { version = "=8.1.0", default-features = false, features = ["dht"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }

iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
iroh-tickets = "=1.0.0"
iroh-mainline-address-lookup = "=0.6.0"
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"

openmls = "=0.9.0"
openmls_traits = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
rmp-serde = "=1.3.1"

tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"], optional = true }
serde_json = { version = "1", optional = true }

push_wire = { path = "../push_wire" }
# The push proxy client (`push-http`): TLS on `ring` with the bundled web roots, no aws-lc.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2"], optional = true }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "=1.0.9", optional = true }

[dev-dependencies]
serde_json = "1"
openmls_memory_storage = "=0.6.0"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
# Tests only: `FakePushProxy` runs the real proxy router in memory (Ruling R2).
push_proxy = { path = "../../server/push_proxy" }
axum = { version = "=0.8.9", default-features = false }
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
[features]
default = ["push-http"]
test-hooks = ["dep:tokio-tungstenite", "dep:serde_json", "iroh/metrics"]
# The HTTP client for the push proxy (`push::HttpPushProxy`). Off for the iOS notification
# extension, which never talks to the proxy.
push-http = ["dep:reqwest", "dep:rustls", "dep:webpki-roots", "dep:serde_json"]
# Read-only MLS decrypt for the iOS notification extension (`mls::nse`). Nothing else of `mls` is public.
nse = []
# Adds `mls::nse::fixture` (builds a group and a snapshot through an in-memory database); for tools and tests only.
nse-fixture = ["nse"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher"] }
libsqlite3-sys = { version = "=0.38.2", features = ["bundled-sqlcipher"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
libsqlite3-sys = { version = "=0.38.2", features = ["bundled-sqlcipher-vendored-openssl"] }

[[test]]
name = "transport"
required-features = ["test-hooks"]
