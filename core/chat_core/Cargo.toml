[package]
name = "chat_core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
bip39 = { version = "=2.2.2", default-features = false, features = ["std", "zeroize"] }
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
hkdf = "=0.12.4"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
zeroize = { version = "=1.9.0", features = ["zeroize_derive"] }
data-encoding = "=2.11.1"
aes-gcm = "=0.10.3"
snow = "=0.10.0"
minicbor = { version = "=0.26.5", features = ["std"] }
pkarr = { version = "=8.1.0", default-features = false, features = ["dht"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }

iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
iroh-tickets = "=1.0.0"
iroh-mainline-address-lookup = "=0.6.0"
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"

tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
[features]
default = []
test-hooks = ["dep:tokio-tungstenite", "dep:serde_json"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[[test]]
name = "transport"
required-features = ["test-hooks"]
