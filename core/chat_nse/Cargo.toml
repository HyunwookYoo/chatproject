[package]
name = "chat_nse"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# staticlib: linked into the iOS notification extension. lib: used by tools/nse_fixture.
# No cdylib: `-lchat_nse` would pick a .dylib that sits next to the .a.
crate-type = ["staticlib", "lib"]

[dependencies]
openmls = "=0.9.0"
openmls_rust_crypto = "=0.6.0"
thiserror = "2"
uniffi = "=0.32.2"

[dev-dependencies]
tempfile = "3"
