[package]
name = "push_proxy"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
push_wire = { path = "../../core/push_wire" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
tower-service = "=0.3.3"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
data-encoding = "=2.11.1"
getrandom = "=0.3.4"
futures-core = "=0.3.34"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
futures-util = "=0.3.34"
tokio = { version = "=1.53.2", features = ["io-util"] }
