[package]
name = "push_proxy"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
push_wire = { path = "../../core/push_wire" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
tower-service = "=0.3.3"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
data-encoding = "=2.11.1"
getrandom = "=0.3.4"
futures-core = "=0.3.34"
# TLS on `ring` only (no aws-lc): `rustls-no-provider` plus a ClientConfig built here.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
ring = "=0.17.14"
# No crypto feature: signing goes through the `ring` provider in `jwt.rs`.
jsonwebtoken = { version = "=12.0.0", default-features = false, features = ["use_pem"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
futures-util = "=0.3.34"
tokio = { version = "=1.53.2", features = ["io-util"] }
# In-process HTTP/2 + TLS fake of FCM, Google OAuth and APNs; test keys are made at run time.
hyper = { version = "=1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "=0.1.21", features = ["server-auto", "tokio"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
rcgen = "=0.14.7"
rsa = "=0.9.10"
