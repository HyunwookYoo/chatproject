[package]
name = "queue_server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
queue_wire = { path = "../../core/queue_wire" }
http_guard = { path = "../http_guard" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "=1.0.229" }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
# Plain bundled SQLite. A `--workspace` build unifies this with chat_core's
# `bundled-sqlcipher-vendored-openssl` and links SQLCipher instead, which
# without a key reads and writes the same file format.
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
tempfile = "=3.27.0"
