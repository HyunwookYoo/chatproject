[package]
name = "chat_node"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
harness = ["chat_core/test-hooks"]

[[bin]]
name = "chat_node"
path = "src/main.rs"
required-features = ["harness"]

[[test]]
name = "cli"
required-features = ["harness"]

[dependencies]
chat_core = { path = "../../core/chat_core" }
clap = { version = "4", features = ["derive"] }
iroh-relay = { version = "=1.3.0", default-features = false, features = ["server"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures-util = "0.3"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading"] }
